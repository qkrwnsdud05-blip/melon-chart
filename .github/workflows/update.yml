name: 멜론 차트 갱신

on:
  schedule:
    # 30분마다 (UTC 기준 매시 5분, 35분 = 멜론이 정각에 차트를 바꾼 뒤 조금 기다렸다가)
    - cron: "5,35 * * * *"
  workflow_dispatch: # Actions 탭의 "Run workflow" 수동 실행 버튼
  push:
    branches: [main]
    paths-ignore: ["data/**"] # 앱 파일을 올리면 바로 다시 공개 (차트 자동 저장은 제외)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: melon-chart
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 멜론 차트 가져오기
        run: python update_chart.py

      - name: 바뀐 내용 저장(커밋)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음"
          else
            git commit -m "차트 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    # 차트가 바뀌었거나, 수동 실행/파일 수정일 때만 페이지를 다시 올림
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 공개할 파일만 모으기
        run: |
          mkdir _site
          cp index.html app.js firebase-config.js manifest.webmanifest sw.js help.html seed_songs.json _site/
          cp -r icons data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
